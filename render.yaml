# Render Blueprint for the Streamly backend (Node + Socket.IO).
# Render dashboard → New + → Blueprint → pick this repo. Render reads this file and creates the service.
services:
  - type: web
    name: streamly-backend
    runtime: node
    plan: free
    region: singapore          # closest Render region to India
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://streamly-psi-six.vercel.app
      # Optional TURN relay (cameras on strict networks). Render asks for these values when you create the Blueprint.
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
