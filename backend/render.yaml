# Render Blueprint for the Streamly backend (Node + Socket.IO).
# Render → New + → Blueprint → pick this repo → Blueprint Path: backend/render.yaml
services:
  - type: web
    name: streamly-backend
    runtime: node
    plan: free
    region: singapore          # closest Render region to India
    branch: main
    rootDir: backend           # paths are relative to the repo root
    # The script installs deps even if the build image has no `npm` on PATH ("npm: command not found").
    buildCommand: bash scripts/render-build.sh
    # Start with node directly: no npm needed at runtime.
    startCommand: node src/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://streamly-psi-six.vercel.app
      # Optional TURN relay (cameras on strict networks). Render asks for these when you apply the Blueprint.
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
