<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Stream high-definition videos and movies directly from your phone to your laptop in full original quality over WebRTC without cloud uploads or accounts." />
    <meta name="keywords" content="video streaming, p2p, webrtc, phone to laptop, local network streaming, stream without cloud" />
    <meta name="author" content="Streamly" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://streamly.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://streamly.app/" />
    <meta property="og:title" content="Streamly — Your phone. Your movie. Your big screen." />
    <meta property="og:description" content="Stream videos from your phone to your laptop without uploading them to the cloud. Direct peer-to-peer WebRTC streaming in lossless quality." />
    <meta property="og:image" content="https://streamly.app/og-image.svg" />
    <meta property="og:site_name" content="Streamly" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://streamly.app/" />
    <meta name="twitter:title" content="Streamly — Your phone. Your movie. Your big screen." />
    <meta name="twitter:description" content="Stream videos from your phone to your laptop without uploading them to the cloud. Direct peer-to-peer WebRTC streaming." />
    <meta name="twitter:image" content="https://streamly.app/og-image.svg" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/streamly.svg" />
    <link rel="apple-touch-icon" href="/streamly.svg" />

    <title>Streamly — Your phone. Your movie. Your big screen.</title>

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Production HTTPS Enforcement -->
    <script>
      if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        location.replace('https:' + location.href.substring(location.protocol.length));
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
