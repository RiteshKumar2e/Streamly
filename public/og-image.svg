<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="150" cy="100" r="300" fill="#4f46e5" opacity="0.05"/>
  <circle cx="1050" cy="500" r="350" fill="#0284c7" opacity="0.05"/>

  <!-- Main Card -->
  <rect x="80" y="70" width="1040" height="490" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>

  <!-- Logo and Brand -->
  <g transform="translate(140, 130)">
    <rect width="64" height="64" rx="16" fill="url(#brandGrad)"/>
    <path d="M24 18 L24 46 L46 32 Z" fill="#ffffff"/>
    <text x="84" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="36" font-weight="800" fill="#0f172a">Streamly</text>
    <rect x="250" y="16" width="130" height="34" rx="17" fill="#e0e7ff"/>
    <text x="268" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700" fill="#4f46e5">P2P DIRECT</text>
  </g>

  <!-- Main Headline -->
  <text x="140" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="52" font-weight="900" fill="#0f172a" letter-spacing="-1.5">
    Your phone. Your movie.
  </text>
  <text x="140" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="52" font-weight="900" fill="url(#brandGrad)" letter-spacing="-1.5">
    Your big screen.
  </text>

  <!-- Subtitle -->
  <text x="140" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="400" fill="#475569">
    Stream high-bitrate video directly from your mobile gallery to your laptop. Zero cloud uploads.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(140, 450)">
    <rect x="0" y="0" width="220" height="46" rx="23" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="600" fill="#334155">🔒 100% Encrypted</text>

    <rect x="236" y="0" width="210" height="46" rx="23" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="260" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="600" fill="#334155">⚡ Zero Cloud Wait</text>

    <rect x="462" y="0" width="200" height="46" rx="23" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="486" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="600" fill="#334155">🍿 Lossless 4K</text>
  </g>
</svg>
